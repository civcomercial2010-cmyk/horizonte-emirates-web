<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="referrer" content="strict-origin-when-cross-origin"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; form-action 'self'; frame-ancestors 'none'"/>
<title>Página no encontrada | Horizonte Emirates</title>
<meta name="robots" content="noindex,follow"/>
<link rel="icon" type="image/svg+xml" href="assets/logos/horizonte-emirates/favicon.svg"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%}
  body{
    min-height:100%;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(155deg,#07121F 0%,#0D1B2A 60%,#07121F 100%);
    color:#F8F6F1;font-family:'Inter',system-ui,Arial,sans-serif;
    padding:24px;text-align:center;line-height:1.6;
  }
  .wrap{max-width:560px}
  .logo{font-family:Georgia,'Cormorant Garamond',serif;font-size:24px;font-weight:500;letter-spacing:.03em;margin-bottom:32px;color:#fff}
  .logo span{color:#C4942A}
  .code{font-family:Georgia,serif;font-size:clamp(64px,14vw,104px);font-weight:600;color:#C4942A;line-height:1;margin-bottom:8px}
  h1{font-family:Georgia,'Cormorant Garamond',serif;font-size:clamp(26px,4vw,34px);font-weight:500;color:#fff;margin-bottom:14px}
  p{font-size:16px;color:rgba(248,246,241,.7);max-width:42ch;margin:0 auto 32px}
  .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  a.btn{
    display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;padding:14px 28px;border-radius:2px;
    text-decoration:none;transition:.2s
  }
  a.gold{background:#C4942A;color:#fff}
  a.gold:hover{filter:brightness(1.08)}
  a.ghost{border:1px solid rgba(255,255,255,.4);color:#fff}
  a.ghost:hover{border-color:rgba(255,255,255,.75)}
  .rule{width:38px;height:1px;background:#C4942A;margin:0 auto 28px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">Horizonte <span>Emirates</span></div>
    <div class="code">404</div>
    <div class="rule"></div>
    <h1>Esta página no existe</h1>
    <p>El enlace que ha seguido no está disponible o ha cambiado de dirección. Use los accesos siguientes para continuar.</p>
    <div class="actions">
      <a class="btn gold" href="/">Volver al inicio &nbsp;→</a>
      <a class="btn ghost" href="/proyectos.html">Ver proyectos</a>
    </div>
  </div>
</body>
</html>
